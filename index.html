<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="loading">
      <div class="svg_container">
        <svg class="rotating" viewBox="0 0 1024 896">
          <g><path class="st0" d="M256,448c0,70.7-57.3,128-128,128S0,518.7,0,448s57.3-128,128-128S256,377.3,256,448z"/></g>
        </svg>
        <svg class="rotating" viewBox="0 0 1024 896">
          <g><path class="st1" d="M448,128c0,70.7-57.3,128-128,128s-128-57.3-128-128S249.3,0,320,0S448,57.3,448,128z"/></g>
        </svg>
        <svg class="rotating" viewBox="0 0 1024 896">
          <g><path class="st2" d="M832,128c0,70.7-57.3,128-128,128s-128-57.3-128-128S633.3,0,704,0S832,57.3,832,128z"/></g>
        </svg>
         <svg class="rotating" viewBox="0 0 1024 896">
          <g><path class="st1" d="M1024,448c0,70.7-57.3,128-128,128s-128-57.3-128-128s57.3-128,128-128S1024,377.3,1024,448z"/></g>
        </svg>
        <svg class="rotating" viewBox="0 0 1024 896">
          <g><path class="st3" d="M832,768c0,70.7-57.3,128-128,128s-128-57.3-128-128s57.3-128,128-128S832,697.3,832,768z"/></g>
        </svg>
        <svg class="rotating" viewBox="0 0 1024 896">
          <g><path class="st1" d="M448,768c0,70.7-57.3,128-128,128s-128-57.3-128-128s57.3-128,128-128S448,697.3,448,768z"/></g>
        </svg>
      </div>
      <h1>
        Loading...
      </h1>
    </div>
    <div id="controls" class="hidden">
      <select id="xaxis"></select>
      <select id="yaxis"></select>
      <div id="plot"></div>
      Add:
      <button id="addPlot">Plot</button>
      <button id="addHistogram">Histogram</button>

      <div style="flex-grow: 1;"></div>
      <div>
        Filtered: <span id="filteredCount"></span> / Total:
        <span id="totalCount"></span> Rows
      </div>
    </div>

    <div id="plots" class="hidden"></div>

    <div id="footer" class="panel hidden">
      <label>Table <input type="radio" id="tableView" name="view" checked /></label>
      <label>Thumbnails <input type="radio" id="thumbnailView" name="view" /></label>
      <hr />
      <div id="table"></div>
      <div id="thumbnails" class="hide">Thumbnails</div>
    </div>




    <script type="module" src="/src/main.js"></script>
  </body>
</html>
