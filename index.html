<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f6f6f6;
        margin: 0;
        display: flex;
        flex-direction: column;
      }
      .panel {
        background: white;
        border-radius: 10px;
        float: left;
        box-sizing: border-box;
        overflow: auto;
        margin: 10px;
        padding: 10px;
      }
      #thumbnails {
        width: 150px;
        height: 200px;
      }
      #controls {
        flex: 0 0 auto;
        width: 100%;
        margin: 10px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
      }
      #table th {
        position: sticky;
        top: 0;
        background: white;
        z-index: 1;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 20px;
        color: #999;
        width: 300px;
        text-align: center;
      }
      .hidden {
        visibility: hidden;
      }
      svg.rotating {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin-left: 50px;
      }
      .rotating {
        animation: rotation 6s infinite linear;
      }
      .rotating:nth-child(1) {
        animation-delay: 1s;
      }
      .rotating:nth-child(2) {
        animation-delay: 2s;
      }
      .rotating:nth-child(3) {
        animation-delay: 3s;
      }
      .rotating:nth-child(4) {
        animation-delay: 4s;
      }
      .rotating:nth-child(5) {
        animation-delay: 5s;
      }
      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        17.5% {
          transform: rotate(360deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .st0 {
        fill: #df283f;
      }
      .st1 {
        fill: #1c4a87;
      }
      .st2 {
        fill: #128669;
      }
      .st3 {
        fill: #1d8dcd;
      }
      .svg_container {
        position: absolute;
        width: 200px;
        height: 200px;
        margin-bottom: 15px;
      }
      #loading h1 {
        margin-top: 220px;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="svg_container">
        <svg class="rotating" viewBox="0 0 1024 896">
          <g><path class="st0" d="M256,448c0,70.7-57.3,128-128,128S0,518.7,0,448s57.3-128,128-128S256,377.3,256,448z"/></g>
        </svg>
        <svg class="rotating" viewBox="0 0 1024 896">
          <g><path class="st1" d="M448,128c0,70.7-57.3,128-128,128s-128-57.3-128-128S249.3,0,320,0S448,57.3,448,128z"/></g>
        </svg>
        <svg class="rotating" viewBox="0 0 1024 896">
          <g><path class="st2" d="M832,128c0,70.7-57.3,128-128,128s-128-57.3-128-128S633.3,0,704,0S832,57.3,832,128z"/></g>
        </svg>
         <svg class="rotating" viewBox="0 0 1024 896">
          <g><path class="st1" d="M1024,448c0,70.7-57.3,128-128,128s-128-57.3-128-128s57.3-128,128-128S1024,377.3,1024,448z"/></g>
        </svg>
        <svg class="rotating" viewBox="0 0 1024 896">
          <g><path class="st3" d="M832,768c0,70.7-57.3,128-128,128s-128-57.3-128-128s57.3-128,128-128S832,697.3,832,768z"/></g>
        </svg>
        <svg class="rotating" viewBox="0 0 1024 896">
          <g><path class="st1" d="M448,768c0,70.7-57.3,128-128,128s-128-57.3-128-128s57.3-128,128-128S448,697.3,448,768z"/></g>
        </svg>
      </div>
      <h1>
        Loading...
      </h1>
    </div>
    <div id="controls" class="hidden">
      <select id="xaxis"></select>
      <select id="yaxis"></select>
      <div id="plot"></div>
      Add:
      <button id="addPlot">Plot</button>
      <button id="addHistogram">Histogram</button>
    </div>

    <div id="plots" class="hidden"></div>

    <div id="table" class="panel hidden"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
