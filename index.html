<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f6f6f6;
        margin: 0;
        display: flex;
        flex-direction: column;
      }
      .panel {
        background: white;
        border-radius: 10px;
        float: left;
        box-sizing: border-box;
        overflow: auto;
        margin: 10px;
        padding: 10px;
      }
      #thumbnails {
        width: 150px;
        height: 200px;
      }
      #controls {
        flex: 0 0 auto;
        width: 100%;
        margin: 10px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
      }
      #table th {
        position: sticky;
        top: 0;
        background: white;
        z-index: 1;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 20px;
        color: #999;
      }
      .hidden {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>Loading...</h1>
    </div>
    <div id="controls" class="hidden">
      <select id="xaxis"></select>
      <select id="yaxis"></select>
      <div id="plot"></div>
      Add:
      <button id="addPlot">Plot</button>
      <button id="addHistogram">Histogram</button>
    </div>

    <div id="plots" class="hidden"></div>

    <div id="table" class="panel hidden"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
